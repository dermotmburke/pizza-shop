{{- if .Values.kafkaUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka-ui
  labels:
    {{- include "pizza-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: kafka-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: kafka-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: kafka-ui
          image: {{ .Values.kafkaUi.image }}:{{ .Values.kafkaUi.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.kafkaUi.port }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: {{ .Release.Name }}-kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-ui
  labels:
    {{- include "pizza-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-ui
spec:
  type: {{ .Values.kafkaUi.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: kafka-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.kafkaUi.port }}
      targetPort: {{ .Values.kafkaUi.port }}
{{- end }}
