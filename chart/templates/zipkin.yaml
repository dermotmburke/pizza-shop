apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-zipkin
  labels:
    {{- include "pizza-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: zipkin
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: zipkin
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: zipkin
          image: {{ .Values.zipkin.image }}:{{ .Values.zipkin.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.zipkin.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.zipkin.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-zipkin
  labels:
    {{- include "pizza-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: zipkin
spec:
  type: {{ .Values.zipkin.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: zipkin
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.zipkin.port }}
      targetPort: {{ .Values.zipkin.port }}
