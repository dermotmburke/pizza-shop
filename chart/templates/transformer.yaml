apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-transformer
  labels:
    {{- include "pizza-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: transformer
spec:
  replicas: {{ .Values.transformer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: transformer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: transformer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: transformer
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}/pizza-shop-transformer:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.transformer.port }}
          env:
            {{- include "pizza-shop.appEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.transformer.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.transformer.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-transformer
  labels:
    {{- include "pizza-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: transformer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: transformer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.transformer.port }}
      targetPort: {{ .Values.transformer.port }}
