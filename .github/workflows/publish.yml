name: Publish Docker Images

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules (skip Jib dockerBuild)
        run: ./mvnw install -DskipTests -Djib.skip=true

      - name: Publish pizza-shop-web-receiver
        run: |
          ./mvnw jib:build -pl pizza-shop-web-receiver \
            -Djib.to.image=ghcr.io/${{ github.repository_owner }}/pizza-shop-web-receiver:latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Publish pizza-shop-transformer
        run: |
          ./mvnw jib:build -pl pizza-shop-transformer \
            -Djib.to.image=ghcr.io/${{ github.repository_owner }}/pizza-shop-transformer:latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Publish pizza-shop-repository
        run: |
          ./mvnw jib:build -pl pizza-shop-repository \
            -Djib.to.image=ghcr.io/${{ github.repository_owner }}/pizza-shop-repository:latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
